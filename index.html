  { d:20, title:'模拟复盘 + 背模板，不学新东西',
    vids:[],
    code:'把下面「模板速查」7 段全部默写一遍；复盘昨天模拟每道题为什么错',
    drill:'第二套模拟（或只做昨天错的题）',
    tip:'<b>考前一天绝对不学新知识</b>，把会的背熟、睡好觉。机试最容易丢的分不是难题，是大数组放 main 里爆栈、endl 超时、忘了取消同步这几件小事。'
  }
];

var TIPS = [
  { h:'1. 开头模板（每题都复制它）', code:
'#include <bits/stdc++.h>\n' +
'using namespace std;\n' +
'const int N = 1e5 + 10;   // 大数组一定放全局，不能放 main 里（会爆栈）\n' +
'int a[N];\n' +
'\n' +
'int main(){\n' +
'    ios::sync_with_stdio(false);   // 取消同步，读入快很多\n' +
'    cin.tie(0);                    // 这两个必须写在 main 第一行\n' +
'    int n;\n' +
'    while (cin >> n) {             // 多组输入的标准写法\n' +
'        // 处理这一组\n' +
'    }\n' +
'    return 0;\n' +
'}' },
  { h:'2. sort + 结构体排序（最高频考点）', code:
'struct Stu { string name; int score, id; };\n' +
'\n' +
'bool cmp(const Stu &x, const Stu &y) {\n' +
'    if (x.score != y.score) return x.score > y.score;  // 成绩高的在前（降序）\n' +
'    if (x.id    != y.id)    return x.id    < y.id;     // 同分：学号小的在前（升序）\n' +
'    return x.name < y.name;                            // 还相同：名字字典序\n' +
'}\n' +
'\n' +
'sort(v.begin(), v.end(), cmp);   // 对 vector 排序\n' +
'sort(a + 1, a + n + 1, cmp);     // 对从 1 开始的数组排序\n' +
'sort(a, a + n);                  // 对从 0 开始的数组排序（默认小到大）' },
  { h:'3. vector 动态数组', code:
'vector<int> v;\n' +
'v.push_back(3);        // 尾部加一个\n' +
'v.size();              // 有几个元素\n' +
'v.pop_back();          // 删掉最后一个\n' +
'v.clear();             // 清空\n' +
'sort(v.begin(), v.end());          // 排序\n' +
'for (int i = 0; i < (int)v.size(); i++) cout << v[i] << \' \';\n' +
'for (auto x : v) cout << x << \' \';   // 范围 for，更省事' },
  { h:'4. set 去重 / map 计数', code:
'set<int> s;\n' +
's.insert(5);                 // 自动去重、自动升序\n' +
'if (s.count(5)) cout << "在";\n' +
'for (auto x : s) cout << x << \' \';\n' +
'\n' +
'map<string, int> m;\n' +
'm["apple"]++;                        // 计数最常用写法\n' +
'if (m.count("apple")) { }            // 判断在不在：用 count，别用 m[key]==0\n' +
'for (auto &p : m) cout << p.first << \' \' << p.second << \'\\n\';' },
  { h:'5. 前缀和', code:
'int a[N], sum[N];\n' +
'for (int i = 1; i <= n; i++) sum[i] = sum[i-1] + a[i];\n' +
'\n' +
'// 区间 [l, r] 的和，O(1) 出结果\n' +
'cout << sum[r] - sum[l-1];' },
  { h:'6. 二分查找模板', code:
'// 找第一个 >= x 的位置\n' +
'int l = 1, r = n, ans = -1;\n' +
'while (l <= r) {\n' +
'    int mid = (l + r) / 2;\n' +
'    if (a[mid] >= x) { ans = mid; r = mid - 1; }\n' +
'    else l = mid + 1;\n' +
'}' },
  { h:'7. 贪心：区间调度（按结束时间排）', code:
'bool cmpEnd(const pair<int,int> &p, const pair<int,int> &q) {\n' +
'    return p.second < q.second;   // 谁先结束谁排前面\n' +
'}\n' +
'\n' +
'sort(v.begin(), v.end(), cmpEnd);\n' +
'int cnt = 0, last = -1000000000;\n' +
'for (auto &p : v) {\n' +
'    if (p.first >= last) {        // 上一个结束之后才开始，就能参加\n' +
'        cnt++;\n' +
'        last = p.second;\n' +
'    }\n' +
'}' }
];

var STORE = 'cpp20_daka_v1';
var state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { state = {}; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

var wrap = document.getElementById('wrap');
var lastPh = '';
var allIds = [];

DAYS.forEach(function(day){
  if (day.ph && day.ph !== lastPh) {
    lastPh = day.ph;
    var ph = document.createElement('div');
    ph.className = 'phase';
    ph.textContent = day.ph;
    wrap.appendChild(ph);
  }
  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'card' + day.d;

  var ti = document.createElement('div');
  ti.className = 'day-title';
  var num = document.createElement('span');
  num.className = 'num';
  num.textContent = 'D' + day.d;
  ti.appendChild(num);
  ti.appendChild(document.createTextNode(day.title));
  card.appendChild(ti);

  function addRow(id, tagText, text, minText, noteText, hot) {
    var row = document.createElement('div');
    row.className = 'row';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = id;
    cb.checked = !!state[id];
    cb.setAttribute('data-day', day.d);
    allIds.push(id);
    var lb = document.createElement('label');
    lb.setAttribute('for', id);
    var tg = document.createElement('span');
    tg.className = 'tag' + (hot ? ' hot' : '');
    tg.textContent = tagText;
    lb.appendChild(tg);
    lb.appendChild(document.createTextNode(text));
    if (minText) {
      var m = document.createElement('span');
      m.className = 'min';
      m.textContent = '　' + minText;
      lb.appendChild(m);
    }
    if (noteText) {
      var n = document.createElement('span');
      n.className = 'note';
      n.textContent = '　（' + noteText + '）';
      lb.appendChild(n);
    }
    row.appendChild(cb);
    row.appendChild(lb);
    if (cb.checked) row.classList.add('checked');
    card.appendChild(row);
    return row;
  }

  (day.vids || []).forEach(function(v, i){
    addRow('d' + day.d + 'v' + i, '看视频', v.t, v.m + ' 分钟', v.note, v.note && v.note.indexOf('重看') === 0);
  });
  if (day.code)  addRow('d' + day.d + 'c', '动手敲', day.code, '', '', false);
  if (day.drill) addRow('d' + day.d + 'x', '刷题', day.drill, '', '', false);

  if (day.tip) {
    var tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = day.tip;
    card.appendChild(tip);
  }

  var w = document.createElement('div');
  w.className = 'wrong';
  var ws = document.createElement('span');
  ws.textContent = '📝 今天卡住的 / 做错的（写一句原因就够）：';
  w.appendChild(ws);
  var ta = document.createElement('textarea');
  ta.id = 'e' + day.d;
  ta.placeholder = '例：sort 忘了写 a+1 导致从 1 存的时候错位';
  ta.value = state['e' + day.d] || '';
  w.appendChild(ta);
  card.appendChild(w);

  wrap.appendChild(card);
});

// 填充模板速查区
TIPS.forEach(function(t, i){
  document.getElementById('t' + (i+1)).textContent = t.code;
});

function refresh(){
  var total = allIds.length, done = 0;
  allIds.forEach(function(id){
    var cb = document.getElementById(id);
    if (cb && cb.checked) done++;
    var row = cb ? cb.parentNode : null;
    if (row) { if (cb.checked) row.classList.add('checked'); else row.classList.remove('checked'); }
  });
  DAYS.forEach(function(day){
    var ids = allIds.filter(function(id){ var c2 = document.getElementById(id); return c2 && c2.getAttribute('data-day') === String(day.d); });
    var card = document.getElementById('card' + day.d);
    var allDone = ids.length > 0 && ids.every(function(id){
      var cb = document.getElementById(id); return cb && cb.checked;
    });
    if (card) { if (allDone) card.classList.add('done-all'); else card.classList.remove('done-all'); }
  });
  var pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('stat').textContent = '总进度：' + done + ' / ' + total + ' 项（' + pct + '%）　每天视频不超过 35 分钟，敲代码至少 90 分钟';
}

wrap.addEventListener('change', function(e){
  var t = e.target;
  if (t && t.type === 'checkbox' && t.id) {
    state[t.id] = t.checked ? 1 : 0;
    save();
    refresh();
  }
});
wrap.addEventListener('input', function(e){
  var t = e.target;
  if (t && t.tagName === 'TEXTAREA' && t.id) {
    state[t.id] = t.value;
    save();
  }
});

refresh();
</script>
