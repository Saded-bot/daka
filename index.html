<style>

  }
  .tip b { color: #b26a00; }
  .wrong { margin-top: 10px; }
  .wrong span { font-size: 13px; color: #7a8899; }
  textarea {
    width: 100%; margin-top: 4px; padding: 7px 9px; font-size: 13.5px;
    font-family: inherit; border: 1px solid #dbe3ee; border-radius: 8px;
    resize: vertical; min-height: 42px; color: #333; background: #fbfcfe;
  }
  textarea:focus { outline: 2px solid #b9d2ff; background: #fff; }
  .tpl {
    background: #fff; border-radius: 12px; padding: 16px 18px;
    border: 1px solid #e3e9f2; margin-top: 30px;
  }
  .tpl h2 { font-size: 17px; color: #0b3fa8; margin: 0 0 12px; }
  .tpl h3 { font-size: 14.5px; color: #14345e; margin: 18px 0 6px; }
  pre {
    background: #0f1b2d; color: #d7e3f4; padding: 12px 14px; border-radius: 9px;
    font-family: Consolas, "Courier New", monospace; font-size: 13px;
    overflow-x: auto; line-height: 1.6; margin: 0;
  }
  footer { text-align: center; font-size: 12.5px; color: #93a1b3; padding: 24px; }
  @media (max-width: 640px) {
    header { padding: 10px 12px 10px; }
    header h1 { font-size: 15px; line-height: 1.5; margin-bottom: 4px; }
    .stat { font-size: 12px; }
    .bar-wrap { height: 10px; margin-top: 6px; }
    main { padding: 12px 10px; }
    .phase { font-size: 14.5px; padding: 9px 12px; margin: 20px 0 9px; }
    .card { padding: 12px 12px 10px; border-radius: 10px; margin-bottom: 12px; }
    .day-title { font-size: 15px; line-height: 1.6; }
    .day-title .num { min-width: 24px; padding: 0 7px; font-size: 13px; margin-right: 7px; }
    .row { font-size: 14px; gap: 8px; padding: 7px 0; }
    .row input[type=checkbox] { width: 22px; height: 22px; margin-top: 1px; }
    .min { font-size: 12.5px; }
    .note { font-size: 12.5px; }
    .tag { font-size: 11.5px; padding: 0 5px; }
    .tip { font-size: 13px; padding: 8px 10px; line-height: 1.65; }
    .wrong span { font-size: 12.5px; }
    textarea { font-size: 16px; min-height: 46px; }
    .tpl { padding: 14px 12px !important; margin: 22px 10px 0 !important; }
    .tpl h2 { font-size: 16px; }
    .tpl h3 { font-size: 14px; }
    pre { font-size: 12px; padding: 10px 10px; line-height: 1.55; }
    footer { font-size: 12px; padding: 18px 12px; }
  }
  @media print {
    header { position: static; }
    .bar-wrap, .bar { display: none; }
    body { background: #fff; }
    .card { break-inside: avoid; box-shadow: none; }
  }
</style>

<div class="tpl" style="max-width:900px;margin:0 auto;padding:16px;">

<footer>打好勾会自动存在浏览器里，关掉网页也不会丢喵~</footer>

<script>
var DAYS = [
  { d:1, ph:'冲刺 9 天（10/31 → 11/8）★ 基础语法 + 排序 + 贪心，三块都要稳', date:'10/31 周六', title:'基础语法回炉：顺序结构 + 分支结构 + 循环',
    vids:[],
    code:'今天不学新东西，只刷题把旧知识捡回来：输入输出 2 道 + if/else 2 道 + for/while 2 道',
    drill:'基础题 6 道（在 OJ 上按「顺序结构 / 分支结构 / 循环」筛）',
    tip:'<b>顺序结构</b> = 代码从上往下一行行执行，说白了就是「先输入、再算、最后输出」；<b>分支结构</b> = if / else if / else 和 switch。这两块是考核里说的「基础语法」，你学 C 时全写过，今天只是把手感和手速找回来，别当成新知识。哪个概念真忘了，鹏哥课 P18(if-else) / P22(switch) / P23-P24(while、for) 各十几分钟，<b>只挑忘的那一个看</b>。'
  },
  { d:2, date:'11/1 周日', title:'sort 排序 ★ 最重要的一天',
    vids:[
      { t:'鹏哥 P75　sort 函数和结构体的排序', m:46, note:'★ 今天只干这一件事，看完立刻手写' }
    ],
    code:'四个都写一遍：① sort 排从 0 开始的数组 ② sort 排从 1 开始的数组（a+1, a+n+1）③ 结构体按成绩降序 ④ 成绩相同按学号升序',
    drill:'排序类题 3 道（单关键字 / 多关键字 / 字符串排序）',
    tip:'vector 你说已经学会了，这天不排 vector。记死两句：数组从 0 存 → <b>sort(a, a+n)</b>；从 1 存 → <b>sort(a+1, a+n+1)</b>。冒泡/选择排序你 C 里应该写过，知道「两层循环，每次把最大或最小换到末尾」就够了，<b>考试别手写，用 sort</b>。想在考试里从大到小排，写 cmp 或用 greater&lt;int&gt;()。'
  },
  { d:3, date:'11/2 周一', title:'set 和 map：鹏哥课没有这章，直接看模板敲',
    vids:[],
    code:'set 去重：一堆数打进 set，输出自动升序；map 计数：统计每个单词出现几次（m[s]++）；用 s.count(x) 判断某个数在不在',
    drill:'去重题 2 道 + 词频统计 2 道',
    tip:'<b>鹏哥这 186 集里没有 set / map 这一章</b>，所以这天不排视频，直接看页面最下面「模板速查」第 4 段敲。三个必记：set 自动去重 + 自动升序；<b>m[key] 一读会偷偷插入空值</b>，判断在不在要用 m.count(key)；遍历写 for (auto &amp;p : m)，p.first 是键、p.second 是值。'
  },
  { d:4, date:'11/3 周二', title:'栈和队列：括号匹配是高频题',
    vids:[
      { t:'鹏哥 P97　栈和 stack', m:24, note:'' },
      { t:'鹏哥 P98　队列和 queue', m:21, note:'' }
    ],
    code:'用 stack 写括号匹配（左括号压栈，右括号弹出来比对）；用 queue 模拟排队',
    drill:'括号匹配 1 道 + 队列模拟 1 道',
    tip:'<b>栈 = 先进后出</b>（像叠盘子），<b>队列 = 先进先出</b>（像排队买饭）。蓝桥杯特别爱考括号匹配。'
  },
  { d:5, date:'11/4 周三', title:'贪心入门：每一步都选眼前最好的',
    vids:[
      { t:'鹏哥 P127　贪心算法的简介', m:29, note:'' }
    ],
    code:'区间调度（n 个活动最多能参加几个）；排队打水。写之前先想清楚：按什么排序？',
    drill:'贪心题 3 道',
    tip:'贪心题第一步永远问自己：<b>按什么排序？</b> 排序关键字想对了，题就做完一半。想不出来超过 30 分钟就看题解，看懂后自己重写。'
  },
  { d:6, date:'11/5 周四', title:'贪心实战：货仓选址',
    vids:[
      { t:'鹏哥 P128　货仓选址', m:20, note:'经典贪心题' }
    ],
    code:'把昨天的贪心题重写一遍；自己写一遍货仓选址（按位置排序后取中位数）',
    drill:'贪心题 3 道（含重写昨天的）',
    tip:'贪心代码都很短，难的是想不到。<b>看懂题解后必须自己手敲一遍</b>，抄一遍等于没学。'
  },
  { d:7, date:'11/6 周五', title:'前缀和 + 综合刷题',
    vids:[
      { t:'鹏哥 P120　一维前缀和', m:21, note:'' }
    ],
    code:'输入 n 个数和 m 次询问 [l, r]，用前缀和 O(1) 输出区间和',
    drill:'前缀和 2 道 + 排序/贪心 2 道',
    tip:'前缀和从 <b>1 开始存</b>：sum[i] = sum[i-1] + a[i]；区间 [l, r] 的和 = <b>sum[r] - sum[l-1]</b>。拿纸画一遍为什么是减 l-1 而不是减 l。'
  },
  { d:8, date:'11/7 周六', title:'限时模拟（考试前一天）',
    vids:[],
    code:'找一套真题，严格计时 2-3 小时做完，不许查资料、不许看题解',
    drill:'一整套模拟卷 + 复盘每道错题',
    tip:'练的是<b>时间分配</b>：先扫一遍所有题，先做会做的，卡住的立刻跳。今天做错的题，明天考前再看一眼。'
  },
  { d:9, date:'11/8 周日 · 考试', title:'考试日：只看模板，绝不学新东西',
    vids:[],
    code:'考前 30 分钟：把下面「模板速查」过一遍，重点看 sort + cmp、map 计数、前缀和',
    drill:'进场考试',
    tip:'<b>考前一小时绝对不学新知识</b>。最容易丢分的不是难题，是大数组放 main 里爆栈、endl 超时、忘了取消同步这几件小事。'
  }
];

var TIPS = [
  { h:'1. 开头模板（每题都复制它）', code:
'#include <bits/stdc++.h>\n' +
'using namespace std;\n' +
'const int N = 1e5 + 10;   // 大数组一定放全局，不能放 main 里（会爆栈）\n' +
'int a[N];\n' +
'\n' +
'int main(){\n' +
'    ios::sync_with_stdio(false);   // 取消同步，读入快很多\n' +
'    cin.tie(0);                    // 这两个必须写在 main 第一行\n' +
'    int n;\n' +
'    while (cin >> n) {             // 多组输入的标准写法\n' +
'        // 处理这一组\n' +
'    }\n' +
'    return 0;\n' +
'}' },
  { h:'2. sort + 结构体排序（最高频考点）', code:
'struct Stu { string name; int score, id; };\n' +
'\n' +
'bool cmp(const Stu &x, const Stu &y) {\n' +
'    if (x.score != y.score) return x.score > y.score;  // 成绩高的在前（降序）\n' +
'    if (x.id    != y.id)    return x.id    < y.id;     // 同分：学号小的在前（升序）\n' +
'    return x.name < y.name;                            // 还相同：名字字典序\n' +
'}\n' +
'\n' +
'sort(v.begin(), v.end(), cmp);   // 对 vector 排序\n' +
'sort(a + 1, a + n + 1, cmp);     // 对从 1 开始的数组排序\n' +
'sort(a, a + n);                  // 对从 0 开始的数组排序（默认小到大）' },
  { h:'3. vector 动态数组', code:
'vector<int> v;\n' +
'v.push_back(3);        // 尾部加一个\n' +
'v.size();              // 有几个元素\n' +
'v.pop_back();          // 删掉最后一个\n' +
'v.clear();             // 清空\n' +
'sort(v.begin(), v.end());          // 排序\n' +
'for (int i = 0; i < (int)v.size(); i++) cout << v[i] << \' \';\n' +
'for (auto x : v) cout << x << \' \';   // 范围 for，更省事' },
  { h:'4. set 去重 / map 计数', code:
'set<int> s;\n' +
's.insert(5);                 // 自动去重、自动升序\n' +
'if (s.count(5)) cout << "在";\n' +
'for (auto x : s) cout << x << \' \';\n' +
'\n' +
'map<string, int> m;\n' +
'm["apple"]++;                        // 计数最常用写法\n' +
'if (m.count("apple")) { }            // 判断在不在：用 count，别用 m[key]==0\n' +
'for (auto &p : m) cout << p.first << \' \' << p.second << \'\\n\';' },
  { h:'5. 前缀和', code:
'int a[N], sum[N];\n' +
'for (int i = 1; i <= n; i++) sum[i] = sum[i-1] + a[i];\n' +
'\n' +
'// 区间 [l, r] 的和，O(1) 出结果\n' +
'cout << sum[r] - sum[l-1];' },
  { h:'6. 二分查找模板', code:
'// 找第一个 >= x 的位置\n' +
'int l = 1, r = n, ans = -1;\n' +
'while (l <= r) {\n' +
'    int mid = (l + r) / 2;\n' +
'    if (a[mid] >= x) { ans = mid; r = mid - 1; }\n' +
'    else l = mid + 1;\n' +
'}' },
  { h:'7. 贪心：区间调度（按结束时间排）', code:
'bool cmpEnd(const pair<int,int> &p, const pair<int,int> &q) {\n' +
'    return p.second < q.second;   // 谁先结束谁排前面\n' +
'}\n' +
'\n' +
'sort(v.begin(), v.end(), cmpEnd);\n' +
'int cnt = 0, last = -1000000000;\n' +
'for (auto &p : v) {\n' +
'    if (p.first >= last) {        // 上一个结束之后才开始，就能参加\n' +
'        cnt++;\n' +
'        last = p.second;\n' +
'    }\n' +
'}' }
];

var STORE = 'cpp20_daka_v4';
var state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { state = {}; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

var wrap = document.getElementById('wrap');
var lastPh = '';
var allIds = [];

DAYS.forEach(function(day){
  if (day.ph && day.ph !== lastPh) {
    lastPh = day.ph;
    var ph = document.createElement('div');
    ph.className = 'phase';
    ph.textContent = day.ph;
    wrap.appendChild(ph);
  }
  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'card' + day.d;

  var ti = document.createElement('div');
  ti.className = 'day-title';
  var num = document.createElement('span');
  num.className = 'num';
  num.textContent = 'D' + day.d;
  ti.appendChild(num);
  ti.appendChild(document.createTextNode(day.title));
  if (day.date) { var dl = document.createElement('span'); dl.className = 'date'; dl.textContent = day.date; ti.appendChild(dl); }
  card.appendChild(ti);

  function addRow(id, tagText, text, minText, noteText, hot) {
    var row = document.createElement('div');
    row.className = 'row';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = id;
    cb.checked = !!state[id];
    cb.setAttribute('data-day', day.d);
    allIds.push(id);
    var lb = document.createElement('label');
    lb.setAttribute('for', id);
    var tg = document.createElement('span');
    tg.className = 'tag' + (hot ? ' hot' : '');
    tg.textContent = tagText;
    lb.appendChild(tg);
    lb.appendChild(document.createTextNode(text));
    if (minText) {
      var m = document.createElement('span');
      m.className = 'min';
      m.textContent = '　' + minText;
      lb.appendChild(m);
    }
    if (noteText) {
      var n = document.createElement('span');
      n.className = 'note';
      n.textContent = '　（' + noteText + '）';
      lb.appendChild(n);
    }
    row.appendChild(cb);
    row.appendChild(lb);
    if (cb.checked) row.classList.add('checked');
    card.appendChild(row);
    return row;
  }

  (day.vids || []).forEach(function(v, i){
    addRow('d' + day.d + 'v' + i, '看视频', v.t, v.m + ' 分钟', v.note, v.note && v.note.indexOf('重看') === 0);
  });
  if (day.code)  addRow('d' + day.d + 'c', '动手敲', day.code, '', '', false);
  if (day.drill) addRow('d' + day.d + 'x', '刷题', day.drill, '', '', false);

  if (day.tip) {
    var tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = day.tip;
    card.appendChild(tip);
  }

  var w = document.createElement('div');
  w.className = 'wrong';
  var ws = document.createElement('span');
  ws.textContent = '📝 今天卡住的 / 做错的（写一句原因就够）：';
  w.appendChild(ws);
  var ta = document.createElement('textarea');
  ta.id = 'e' + day.d;
  ta.placeholder = '例：sort 忘了写 a+1 导致从 1 存的时候错位';
  ta.value = state['e' + day.d] || '';
  w.appendChild(ta);
  card.appendChild(w);

  wrap.appendChild(card);
});

// 填充模板速查区
TIPS.forEach(function(t, i){
  document.getElementById('t' + (i+1)).textContent = t.code;
});

function refresh(){
  var total = allIds.length, done = 0;
  allIds.forEach(function(id){
    var cb = document.getElementById(id);
    if (cb && cb.checked) done++;
    var row = cb ? cb.parentNode : null;
    if (row) { if (cb.checked) row.classList.add('checked'); else row.classList.remove('checked'); }
  });
  DAYS.forEach(function(day){
    var ids = allIds.filter(function(id){ var c2 = document.getElementById(id); return c2 && c2.getAttribute('data-day') === String(day.d); });
    var card = document.getElementById('card' + day.d);
    var allDone = ids.length > 0 && ids.every(function(id){
      var cb = document.getElementById(id); return cb && cb.checked;
    });
    if (card) { if (allDone) card.classList.add('done-all'); else card.classList.remove('done-all'); }
  });
  var pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('bar').style.width = pct + '%';
  var left = Math.max(0, Math.ceil((new Date(2026, 10, 8) - new Date()) / 86400000));
  document.getElementById('stat').textContent = '距 11/8 测试还有 ' + left + ' 天　|　完成 ' + done + ' / ' + total + ' 项（' + pct + '%）';
}

wrap.addEventListener('change', function(e){
  var t = e.target;
  if (t && t.type === 'checkbox' && t.id) {
    state[t.id] = t.checked ? 1 : 0;
    save();
    refresh();
  }
});
wrap.addEventListener('input', function(e){
  var t = e.target;
  if (t && t.tagName === 'TEXTAREA' && t.id) {
    state[t.id] = t.value;
    save();
  }
});

refresh();
</script>
</body>
</html>
